# Moves the RoadRunner API submodule and its nested Temporal API submodule to
# their latest stable tags, regenerates the PHP DTOs and opens a pull request
# authored by the github-actions bot (via the built-in GITHUB_TOKEN, no personal
# access token) whenever the generated output changes.

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

name: 🔄 Generate DTO

permissions:
  contents: write
  pull-requests: write

env:
  API_URL: https://github.com/roadrunner-server/api.git
  TEMPORAL_URL: https://github.com/temporalio/api.git

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the repository
        uses: actions/checkout@v6
        with:
          ref: 1.x
          submodules: false

      - name: 🔗 Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: 🏷️ Resolve the latest stable tags
        id: tags
        run: |
          latest_tag() {
            git ls-remote --tags --refs "$1" 'v*' \
              | awk '{print $2}' | sed 's@refs/tags/@@' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1
          }
          api="$(latest_tag "$API_URL")"
          temporal="$(latest_tag "$TEMPORAL_URL")"
          echo "api=${api}" >> "$GITHUB_OUTPUT"
          echo "version=${api#v}" >> "$GITHUB_OUTPUT"
          echo "temporal=${temporal}" >> "$GITHUB_OUTPUT"
          echo "Latest API: ${api}, latest Temporal API: ${temporal}"

      - name: 📦 Initialise the api-cloud submodule
        run: git submodule update --init --recursive api-cloud

      - name: ⬆️ Check out the API submodules at their latest tags
        run: |
          # Re-clone rather than fetch: a recorded gitlink can point at a commit
          # the remote no longer serves, which breaks a plain submodule update.
          # The nested Temporal API is pinned by the API tag to an older commit,
          # so it is moved to its own latest tag to keep the DTOs current.
          rm -rf api
          git clone --branch "${{ steps.tags.outputs.api }}" "$API_URL" api
          rm -rf api/third_party/api
          git clone --branch "${{ steps.tags.outputs.temporal }}" "$TEMPORAL_URL" api/third_party/api

      - name: 🛠️ Install protoc and the gRPC PHP plugin
        env:
          # Pinned to match the protoc that produced the committed DTOs
          # (untyped setters, google/protobuf ^4.31 in composer.json). apt
          # ships libprotoc 3.21, whose legacy output would rewrite every
          # file; a newer protoc adds typed setters and does the same. Only
          # the grpc plugin is taken from apt, its stub output being
          # independent of this version.
          PROTOC_VERSION: "31.1"
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler-grpc
          protoc --version

      - name: ⚙️ Generate the DTOs
        run: bash generate.sh

      - name: 📤 Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: 1.x
          branch: deps/update-api
          commit-message: "feat: update API to ${{ steps.tags.outputs.version }}"
          title: "feat: update API to ${{ steps.tags.outputs.version }}"
          body: |
            Automated update of the RoadRunner API submodules and the generated DTOs.

            - `api`: `${{ steps.tags.outputs.api }}`
            - Temporal API: `${{ steps.tags.outputs.temporal }}`

            Generated by the `Generate DTO` workflow.
          labels: dependencies
          add-paths: |
            api
            generated
