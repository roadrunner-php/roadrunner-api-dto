# Bumps the RoadRunner API submodule to its latest stable tag, regenerates the
# PHP DTOs and, when anything changed, opens a pull request authored by the
# github-actions bot (via the built-in GITHUB_TOKEN, no personal access token).

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

name: 🔄 Generate DTO

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the repository
        uses: actions/checkout@v6
        with:
          ref: 1.x
          submodules: false

      - name: 🔗 Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: 🏷️ Resolve the latest API tag
        id: api
        env:
          API_URL: https://github.com/roadrunner-server/api.git
        run: |
          # The commit currently pinned by the submodule gitlink. It is compared
          # by SHA, not resolved to a tag: an old pin may reference a commit that
          # no longer exists on the remote, which is exactly what a bump fixes.
          recorded="$(git ls-tree HEAD api | awk '{print $3}')"
          latest="$(git ls-remote --tags --refs "$API_URL" 'v*' \
            | awk '{print $2}' | sed 's@refs/tags/@@' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)"
          latest_sha="$(git ls-remote "$API_URL" "refs/tags/${latest}" | awk '{print $1}')"
          echo "recorded=${recorded}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          if [ "${recorded}" = "${latest_sha}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "API already at ${latest}, nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "API update available: ${recorded} -> ${latest} (${latest_sha})"
          fi

      - name: 📦 Initialise the api-cloud submodule
        if: steps.api.outputs.changed == 'true'
        run: git submodule update --init --recursive api-cloud

      - name: ⬆️ Check out the API submodule at the latest tag
        if: steps.api.outputs.changed == 'true'
        env:
          API_URL: https://github.com/roadrunner-server/api.git
        run: |
          # Re-clone rather than fetch: the recorded gitlink can point at a
          # commit the remote no longer serves, which breaks a plain update.
          rm -rf api
          git clone --branch "${{ steps.api.outputs.latest }}" "$API_URL" api
          git -C api submodule update --init --recursive

      - name: 🛠️ Install protoc and the gRPC PHP plugin
        if: steps.api.outputs.changed == 'true'
        env:
          # Pinned to match the google/protobuf runtime in composer.json
          # (^5.34). apt ships libprotoc 3.21, whose legacy PHP output would
          # rewrite every generated file; only the grpc plugin is taken from
          # apt, since gRPC stub output does not depend on this version.
          PROTOC_VERSION: "34.2"
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler-grpc
          protoc --version

      - name: ⚙️ Generate the DTOs
        if: steps.api.outputs.changed == 'true'
        run: bash generate.sh

      - name: 📤 Open a pull request
        if: steps.api.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: 1.x
          branch: deps/update-api
          commit-message: "feat: update API to ${{ steps.api.outputs.version }}"
          title: "feat: update API to ${{ steps.api.outputs.version }}"
          body: |
            Automated update of the RoadRunner API submodule and the generated DTOs.

            - `api`: bumped to `${{ steps.api.outputs.latest }}`

            Generated by the `Generate DTO` workflow.
          labels: dependencies
          add-paths: |
            api
            generated
