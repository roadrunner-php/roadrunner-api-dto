# Bumps the RoadRunner API submodule to its latest stable tag, regenerates the
# PHP DTOs and, when anything changed, opens a pull request authored by the
# github-actions bot (via the built-in GITHUB_TOKEN, no personal access token).

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

name: 🔄 Generate DTO

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the repository
        uses: actions/checkout@v6
        with:
          ref: 1.x
          submodules: false

      - name: 🔗 Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: 📦 Initialise submodules
        run: git submodule update --init --recursive

      - name: 🏷️ Resolve the latest API tag
        id: api
        run: |
          cd api
          current="$(git describe --tags --exact-match 2>/dev/null || git rev-parse HEAD)"
          git fetch --tags --force --quiet
          latest="$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1)"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          if [ "${current}" = "${latest}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "API already at ${latest}, nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "API update available: ${current} -> ${latest}"
          fi

      - name: ⬆️ Bump the API submodule
        if: steps.api.outputs.changed == 'true'
        run: |
          cd api
          git checkout "${{ steps.api.outputs.latest }}"
          git submodule update --init --recursive

      - name: 🛠️ Install protoc and the gRPC PHP plugin
        if: steps.api.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler protobuf-compiler-grpc

      - name: ⚙️ Generate the DTOs
        if: steps.api.outputs.changed == 'true'
        run: bash generate.sh

      - name: 📤 Open a pull request
        if: steps.api.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: 1.x
          branch: deps/update-api
          commit-message: "feat: update API to ${{ steps.api.outputs.version }}"
          title: "feat: update API to ${{ steps.api.outputs.version }}"
          body: |
            Automated update of the RoadRunner API submodule and the generated DTOs.

            - `api`: `${{ steps.api.outputs.current }}` → `${{ steps.api.outputs.latest }}`

            Generated by the `Generate DTO` workflow.
          labels: dependencies
          add-paths: |
            api
            generated
